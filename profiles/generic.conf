# Profil generic - aman untuk Android mana pun
# brands: (fallback, cocok untuk semua)
OEM_PATTERN='zzz_nomatch'

# Paket yang aman dihapus di hampir semua perangkat Android.
REMOVE="
com.facebook.appmanager
com.facebook.services
com.facebook.system
com.netflix.mediaclient
com.netflix.partner.activation
com.baidu.map.location
com.wapi.wapicertmanage
"

# ns key nilai  # label
SETTINGS="
global private_dns_specifier dns.adguard-dns.com  # DNS pemblokir iklan
global private_dns_mode      hostname             # DNS mode
global window_animation_scale     0  # Animasi window
global transition_animation_scale 0  # Animasi transisi
global animator_duration_scale    0  # Animasi animator
global ble_scan_always_enabled    0  # BLE scan selalu
"
