# JANGAN PERNAH hapus (inti Funtouch - perangkat bisa rusak):
#   com.vivo.abe com.vivo.pem com.vivo.daemonService com.vivo.seclient
#   com.vivo.sps com.funtouch.uiengine com.android.bbk.lockscreen3
#   com.vivo.faceui com.vivo.fingerprintui com.goodix* com.bbk.updater
#   com.vivo.epm com.vivo.aiengine com.vivo.vivo3rdalgoservice
#   seluruh com.qualcomm.* / com.qti.* lain (radio & modem)

# Saklar tersembunyi Funtouch - tidak muncul di UI Setelan.
SETTINGS="
global private_dns_specifier dns.adguard-dns.com  # DNS pemblokir iklan
global private_dns_mode      hostname             # DNS mode
global window_animation_scale     0  # Animasi window
global transition_animation_scale 0  # Animasi transisi
global animator_duration_scale    0  # Animasi animator
global force_hw_ui                1  # Render GPU paksa
global ble_scan_always_enabled    0  # BLE scan selalu
global upload_apk_enable          0  # Telemetri unggah APK
global HAS_PUSH_NOTIFI_BOOT_APPSTORE 0  # Push AppStore saat boot
system hiboard_enabled            0  # Panel Jovi Home layar kiri
system setting_vivo_store_enhance 0  # Peningkatan vivo Store
system vivo_mood_picture_setting_enable 0  # Gambar mood layar kunci
secure vivo_recommended_status    0  # Rekomendasi vivo
secure com_vivo_appstore_desktopfolder_desktopfoldernewappactivity_show  0  # Folder promosi app
secure com_vivo_appstore_desktopfolder_desktopfoldernewgameactivity_show 0  # Folder promosi game
"

DENSITY=420

# vivo Push terdaftar sebagai notification listener -> bisa MEMBACA semua
# notifikasi termasuk OTP & notifikasi bank. Dicabut.
NOTIF_LISTENER_DENY="com.vivo.pushservice/com.vivo.push.util.NotificationMonitor"
